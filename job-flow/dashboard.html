<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" href="../assets/icons/icon.png">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/themes.css">
</head>
<body>
    <div class="sidebar">
        <!-- Added the wrapper container here to lock items on the same horizontal row -->
        <div class="logo-container">
            <img src="../assets/icons/logo.png" class="logoim" alt="logo">
            <h2 class="logo">JobFlow</h2>
        </div>
        <ul>
            <li><a href="./dashboard.html">Dashboard</a></li>
            <li><a href="./index.html">Add job</a></li>
            <li><a href="./app.html">Applications</a></li>
            <li><a href="./analytics.html">Analytics</a></li>
            <li><a href="./profile.html">Profile</a></li>
        </ul>
    </div>

    <div class="main-content">
        
        <div class="topbar">
            <input type="text" class="search" placeholder="Search jobs:">
            <button>🌙</button>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Total applications</h3>
                <p>120</p>
                <img class="contim" src="../assets/images/applied.png" alt="Applied">
            </div>
            <div class="card">
                <h3>Interviews</h3>
                <p>40</p>
                <img src="../assets/images/interview.png" class="contim" alt="Interview">
            </div>
            <div class="card">
                <h3>Offers</h3>
                <p>12</p>
                <img src="../assets/images/offer.png" class="contim" alt="Offer">
            </div>
            <div class="card">
                <h3>Rejected</h3>
                <p>16</p>
                <img src="../assets/images/rejected.png" class="contim" alt="Rejected">
            </div>  
              
        </div>
    
    </div>
</body>
</html>
