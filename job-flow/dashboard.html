<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="icon" href="../assets/icons/icon.png">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/themes.css">
</head>

<body>

    <div class="sidebar">

        <div class="logo-container">
            <img src="../assets/icons/logo.png" class="logoim" alt="Logo">
            <h2 class="logo">JobFlow</h2>
            <div class="menu-btn" id="menubtn">&#9776;</div>
        </div>

        <nav id="list">
            <ul>
                <li><a href="./dashboard.html">Dashboard</a></li>
                <li><a href="./add-job.html">Add Job</a></li>
                <li><a href="./app.html">Applications</a></li>
                <li><a href="./analytics.html">Analytics</a></li>
                <li><a href="./profile.html">Profile</a></li>
            </ul>
        </nav>

    </div>

    <div class="main-content">
        <div class="topbar">
        <form class="search-box">
            <input type="text" class="search" placeholder="Search jobs">
            <button class="search-btn"> 🔍 </button>
        </form>
        <button class="theme-btn">🌙</button>
    </div>

        <div class="cards">

            <div class="card">
                <h3>Total Applications</h3>
                <p>120</p>
                <img src="../assets/images/applied.png" class="contim" alt="Applied">
            </div>

            <div class="card">
                <h3>Interviews</h3>
                <p>40</p>
                <img src="../assets/images/interview.png" class="contim" alt="Interview">
            </div>

            <div class="card">
                <h3>Offers</h3>
                <p>12</p>
                <img src="../assets/images/offer.png" class="contim" alt="Offer">
            </div>

            <div class="card">
                <h3>Rejected</h3>
                <p>16</p>
                <img src="../assets/images/rejected.png" class="contim" alt="Rejected">
            </div>

        </div>

        <div class="real-app">

            <h2>Recent Applications</h2>

            <div class="jobcard">
                <div class="company">
                    <img src="../assets/images/google.png" class="company-logo" alt="Google">
                    <div>
                        <h3>Google</h3>
                        <p>Full Stack Developer</p>
                    </div>
                </div>
            </div>

            <div class="jobcard">
                <div class="company">
                    <img src="../assets/images/microsoft.png" class="company-logo" alt="Microsoft">
                    <div>
                        <h3>Microsoft</h3>
                        <p>Web Developer</p>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>

        const menuBtn=document.getElementById("menubtn");
        const list=document.getElementById("list");

        menuBtn.addEventListener("click",()=>{
            list.classList.toggle("active");
        });

    </script>

</body>
</html>
